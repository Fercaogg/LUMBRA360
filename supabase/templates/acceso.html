<!doctype html>
<html lang="es">
  <body style="margin: 0; padding: 32px 16px; background: #f5f5f2; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #111111; line-height: 1.55;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 520px; margin: 0 auto; background: #ffffff; border: 1px solid #e3e3df; border-radius: 16px;">
      <tr>
        <td style="padding: 32px;">
          <p style="margin: 0 0 24px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em;">LUMBRA360</p>
          <h1 style="margin: 0 0 12px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em;">Su enlace de acceso</h1>
          <p style="margin: 0 0 24px; color: #55554f;">Ha pedido entrar en su panel. El enlace caduca en una hora y solo sirve una vez.</p>
          <p style="margin: 0 0 24px;">
            <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=email" style="display: inline-block; padding: 12px 24px; border-radius: 999px; background: #1b1b1b; color: #ffffff; font-weight: 500; text-decoration: none;">Entrar en el panel</a>
          </p>
          <p style="margin: 0; font-size: 14px; color: #55554f;">Si no lo ha pedido usted, ignore este correo. Nadie podrá entrar sin este enlace.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
